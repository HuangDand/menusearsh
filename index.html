<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .menu-item {
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom:4px;
        }
        .menu-item:hover {
            background-color: #34495e;
        }
        .menu-item.active{
            background-color: #2980b9;
        }
        .menu-item.hide {
            display: none;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            background-color: #f5f7fa;
        }
        /* 内容块，默认隐藏 */
        .content-block{
            display: none;
        }
        /* 激活的内容块显示 */
        .content-block.show{
            display:block;
        }
        .customer-item,.food-item{
            padding:8px 0;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索菜单...">
            </div>
            <ul class="menu-list" id="menuList">
                <li class="menu-item">首页</li>
                <li class="menu-item">用户管理</li>
                <li class="menu-item">角色权限</li>
                <li class="menu-item">订单管理</li>
                <li class="menu-item">商品列表</li>
                <li class="menu-item">分类管理</li>
                <li class="menu-item">数据统计</li>
                <li class="menu-item">系统设置</li>
                <li class="menu-item">日志查看</li>
            </ul>
        </aside>
        <main class="main-content">
            <!-- 首页内容 -->
            <div class="content-block show" data-target="首页">
                <h2>主内容区域</h2>
                <p>在左侧搜索框输入文字过滤菜单，点击左侧菜单切换页面</p>
            </div>
            <!-- 用户管理：初始客户列表，预留注册页面入口 -->
            <div class="content-block" data-target="用户管理">
                <h2>用户管理</h2>
                <p style="margin:10px 0;">客户列表（后续增加注册页面）</p>
                <div class="customer-item">客户1：张三 | 手机号：13800138001</div>
                <div class="customer-item">客户2：李四 | 手机号：13800138002</div>
                <div class="customer-item">客户3：王五 | 手机号：13800138003</div>
                <div class="customer-item">客户4：赵六 | 手机号：13800138004</div>
            </div>
            <!-- 商品列表：菜品文字罗列 -->
            <div class="content-block" data-target="商品列表">
                <h2>商品列表</h2>
                <p style="margin:10px 0;">菜品清单</p>
                <div class="food-item">1. 红烧肉</div>
                <div class="food-item">2. 番茄炒蛋</div>
                <div class="food-item">3. 清蒸鲈鱼</div>
                <div class="food-item">4. 酸辣土豆丝</div>
                <div class="food-item">5. 可乐鸡翅</div>
            </div>
            <!-- 其他菜单默认通用页面 -->
            <div class="content-block" data-target="其他">
                <h2 id="otherTitle"></h2>
                <p>该页面功能开发中</p>
            </div>
        </main>
    </div>
    <script>
        const searchInput = document.getElementById('searchInput');
        const menuItems = document.querySelectorAll('.menu-item');
        const contentBlocks = document.querySelectorAll('.content-block');
        const otherTitle = document.getElementById('otherTitle');

        // 搜索过滤
        searchInput.addEventListener('input', function () {
            const keyword = this.value.trim().toLowerCase();
            menuItems.forEach(item => {
                const text = item.innerText.toLowerCase();
                if (text.includes(keyword)) {
                    item.classList.remove('hide');
                } else {
                    item.classList.add('hide');
                }
            })
        })

        // 菜单点击切换内容
        menuItems.forEach(item=>{
            item.addEventListener('click',()=>{
                // 清除所有选中
                menuItems.forEach(li=>li.classList.remove('active'));
                item.classList.add('active');
                const menuName = item.innerText;

                // 隐藏全部内容块
                contentBlocks.forEach(block=>block.classList.remove('show'));

                // 匹配对应内容
                let targetBlock = null;
                contentBlocks.forEach(block=>{
                    if(block.dataset.target === menuName){
                        targetBlock = block;
                    }
                })
                if(targetBlock){
                    targetBlock.classList.add('show');
                }else{
                    // 其余菜单进入通用开发中页面
                    contentBlocks.forEach(block=>{
                        if(block.dataset.target === "其他"){
                            block.classList.add('show');
                        }
                    })
                    otherTitle.innerText = menuName;
                }
            })
        })
    </script>
</body>
</html>
